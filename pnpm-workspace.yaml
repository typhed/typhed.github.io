# pnpm reads its workspace settings from this file.
packages:
  - "apps/*"
  - "packages/*"

# Every third-party dependency, with its one version, is declared in the root
# package.json, which also links every @typhed/* package. An app or package
# lists only the @typhed/* packages it uses. Because the root already links
# all of them, pnpm creates no node_modules inside an app or package: the one
# node_modules at the repository root serves the whole workspace.
dedupeDirectDeps: true

# eslint-config-next accepts ESLint 9 and later, but three plugins it pulls in
# still declare ESLint up to 9. ESLint 9 is past end of life, and every rule of
# these plugins runs on ESLint 10, so ESLint 10 is accepted for them.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"

# Native and postinstall build scripts are opt-in. The static exports never
# optimise images, so sharp is declined. unrs-resolver ships prebuilt binaries
# and its build script is only a fallback compiler. @clerk/shared's postinstall
# only prints a telemetry notice. esbuild and workerd link the platform
# binaries that wrangler needs, so they are allowed.
allowBuilds:
  "@clerk/shared": false
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
