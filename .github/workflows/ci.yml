name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm comes from "packageManager" and Node.js from "devEngines.runtime"
      # in package.json; the step then installs from the committed lockfile.
      - name: Setup pnpm, Node, And Dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: permalink/requirements.txt

      - name: Install Redirect Generator Dependencies
        run: python -m pip install -r permalink/requirements.txt

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Without a Clerk key the apps build with auth off, which is enough to
      # prove the static exports compile.
      - name: Build
        run: pnpm build
