name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to deploy: all, or a comma-separated list such as web,trading"
        required: true
        default: all

permissions:
  contents: read

jobs:
  targets:
    name: Pick Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      # Full history, so Turborepo can compare against the previous master tip.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version is read from the "packageManager" field in package.json.
      - name: Setup Package Manager (pnpm)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Every apps/<name> with a wrangler.jsonc is deployable; a push deploys
      # the ones affected since the previous tip, a manual run the ones named.
      - name: List Apps To Deploy
        id: pick
        env:
          DEPLOY_APPS: ${{ github.event_name == 'workflow_dispatch' && inputs.apps || 'affected' }}
          TURBO_SCM_BASE: ${{ github.event.before }}
        run: echo "apps=$(node scripts/deploy-targets.mjs)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: targets
    if: needs.targets.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.targets.outputs.apps) }}
    # One deployment per app at a time; never cancel one in flight.
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Package Manager (pnpm)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The web app's build renders the permalink redirect pages.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: permalink/requirements.txt

      - name: Install Redirect Generator Dependencies
        run: python -m pip install -r permalink/requirements.txt

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Every NEXT_PUBLIC_* repository Variable reaches every build, so a new
      # public value needs a Variable, not a workflow edit. They ship to the
      # browser, so they are Variables, not Secrets.
      - name: Export Public Build Variables
        env:
          REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
        run: |
          echo "$REPOSITORY_VARIABLES" \
            | jq -r 'to_entries[] | select(.key | startswith("NEXT_PUBLIC_")) | "\(.key)=\(.value)"' \
            >> "$GITHUB_ENV"

      - name: Require The Clerk Publishable Key
        run: |
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Repository Variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is not set."
            exit 1
          fi

      - name: Build ${{ matrix.app }}
        run: pnpm turbo run build --filter=${{ matrix.app }}

      - name: Deploy ${{ matrix.app }} To Cloudflare
        working-directory: apps/${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
