name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Least privilege for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The platform control file must be a verbatim copy of the canonical
      # source; a drifted copy must never deploy. Until the canonical file
      # lands on typhed.github.io (phase M1) a 404 only warns, so this repo
      # can deploy in the interim.
      - name: Platform config drift guard
        run: |
          set -euo pipefail
          canonical_url="https://raw.githubusercontent.com/typhed/typhed.github.io/master/packages/ui/lib/platform.ts"
          local_copy="apps/web/lib/platform.ts"
          status=$(curl -sS -o /tmp/canonical-platform.ts -w "%{http_code}" "$canonical_url")
          if [ "$status" = "404" ]; then
            echo "::warning::Canonical platform.ts not on typhed.github.io@master yet (M1 pending); drift check skipped."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Could not fetch canonical platform.ts (HTTP $status)."
            exit 1
          fi
          if ! diff -u /tmp/canonical-platform.ts "$local_copy"; then
            version=$(grep -m1 PLATFORM_CONFIG_VERSION "$local_copy" || true)
            echo "::error::$local_copy drifted from the canonical copy ($version). Re-copy the canonical file and commit."
            exit 1
          fi

      - name: Set up pnpm
        # Third-party action pinned to the full commit SHA of the v4 tag so a
        # moved tag can never inject code into the build job.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          # Public key, injected from a repository Variable (not a Secret).
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter web build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
