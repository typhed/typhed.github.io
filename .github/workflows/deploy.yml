name: Deploy Blog to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; do not cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # actions/checkout restores each submodule at the commit this repository
      # has recorded, which goes stale the moment a shared repository moves. The
      # --remote update fast-forwards both to their branch tip, so every release
      # build compiles the newest shared code with no pointer bump here. The
      # explicit fetch matters: checkout clones submodules shallow, so the
      # branch ref has to exist before --remote has anything to follow.
      - name: Follow the shared branches
        run: |
          git submodule foreach git fetch --tags origin
          git submodule update --remote --merge
          git submodule status

      # pnpm version is read from the "packageManager" field in package.json.
      - name: Setup Package Manager (pnpm)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Not --frozen-lockfile: floating the submodules can introduce a
      # dependency this lockfile has never seen, and a frozen install fails on
      # exactly that. Reproducibility is traded for propagation on purpose; see
      # MIGRATION.md in shared.documents.
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # Public analytics / AdSense ids are injected from repository Variables
      # (not Secrets, since they ship to the browser). Missing values are fine:
      # the corresponding feature simply renders nothing.
      - name: Build Static Export
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter web build

      - name: Configure GH Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Artifacts
        id: deployment
        uses: actions/deploy-pages@v4
