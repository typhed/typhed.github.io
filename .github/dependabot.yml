# Version updates for the whole monorepo. pnpm resolves every shared
# dependency through the catalog in pnpm-workspace.yaml, so one pull request
# moves every app and package together.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "⬆️"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "⬆️"
